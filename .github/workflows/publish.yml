name: 🔥 Publish Package to npmjs
on:
  push:
    branches: [main]
jobs:
  release:
    name: 🔥 Publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Tiene que ir antes de setup-node: la caché de abajo necesita el binario
      # de pnpm para saber dónde está el store.
      - name: 🧰 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.3.4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          registry-url: "https://registry.npmjs.org"
          cache: "pnpm"

      - name: 📦 Install packages
        run: pnpm install --frozen-lockfile

      - name: 🪛 Build Chaca
        run: pnpm build

      - name: 🧪 Test
        run: pnpm test

      # La publicación sigue siendo de npm: el .npmrc con el token lo escribe
      # setup-node y `npm publish` lo lee tal cual.
      - name: ✅ Publish
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
