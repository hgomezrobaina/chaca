name: 🖥️ Workflow Dev
on:
  push:
    branches: [chaca-dev]
  pull_request:
    branches: [chaca-dev, main]
jobs:
  release:
    name: 🖥️ Dev
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x, 22.x]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Tiene que ir antes de setup-node: la caché de abajo necesita el binario
      # de pnpm para saber dónde está el store.
      - name: 🧰 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.3.4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          registry-url: "https://registry.npmjs.org"
          cache: "pnpm"

      - name: 📦 Install packages
        run: pnpm install --frozen-lockfile

      - name: 🪛 Build Chaca
        run: pnpm build

      - name: 🧪 Test
        run: pnpm test
